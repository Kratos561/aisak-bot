services:
  - type: web
    name: aisak-bot
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: TEST_GUILD_IDS
        value: 1480142471697530933,1275282755063779459
      - key: LOG_LEVEL
        value: INFO
      - key: YTDLP_OPERATION_TIMEOUT
        value: "45"
      - key: YTDLP_YOUTUBE_PLAYER_CLIENTS
        value: ios,android,web_safari,mweb
      - key: YTDLP_YOUTUBE_RETRY_PLAYER_CLIENTS
        value: android,ios,web_safari,mweb,web_embedded,tv_simply,web
      - key: YTDLP_YOUTUBE_STREAM_ROUTES
        value: "ios,android,mweb,web_safari,web_embedded,tv_simply,android_vr,web"
      - key: YTDLP_JS_RUNTIMES
        value: node
      - key: YTDLP_REMOTE_COMPONENTS
        value: "ejs:github"
      - key: YTDLP_BGUTIL_BASE_URL
        value: "http://127.0.0.1:4416"
      - key: DEFAULT_VOLUME
        value: "70"
      - key: MAX_QUEUE_LENGTH
        value: "100"
      - key: INACTIVITY_TIMEOUT
        value: "300"
      - key: BOT_COLOR
        value: "0x1f77b4"
      - key: LYRICS_ENDPOINT
        value: "https://api.lyrics.ovh/v1"
      - key: YTDLP_YOUTUBE_INCLUDE_DASH
        value: "1"
      - key: YTDLP_YOUTUBE_SKIP_WEBPAGE
        value: "1"
